[project]
name = "tiny-lms"
version = "0.1.0"
description = "Hello world"
authors = [
    { name = "Ivan Chukhran", email = "ivan.chuhran@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.14.1",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy[asyncio]>=2.0.50",
]

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.15",
]
