[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ivan Chukhran", email = "ivan.chuhran@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "pydantic[email]>=2.13.4",
    "database",
    "argon2-cffi>=25.1.0",
]

[tool.uv.sources]
database = { workspace = true }

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
