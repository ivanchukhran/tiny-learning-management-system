[project]
name = "web"
version = "0.1.0"
description = "Server-rendered htmx UI for tiny-lms"
readme = "README.md"
authors = [
    { name = "Ivan Chukhran", email = "ivan.chuhran@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "jinja2>=3.1.4",
    "database",
    "core",
]

[project.scripts]
web = "web:main"

[tool.uv.sources]
database = { workspace = true }
core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
